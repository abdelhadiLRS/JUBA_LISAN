name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      SECRET_KEY: ci-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint changed backend surface
        run: ruff check app alembic --select E9,F821,F841,F541,B007,B905
        env:
          PYTHONPATH: .

      - name: Validate migrations
        env:
          DATABASE_URL: sqlite+aiosqlite:///ci-migrations.db
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: pytest -v
