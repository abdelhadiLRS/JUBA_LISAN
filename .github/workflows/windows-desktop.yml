name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/build-desktop*.ps1'
      - '.github/workflows/windows-desktop.yml'
      - 'backend/alembic.ini'

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build Windows desktop artifacts
        shell: pwsh
        run: ./scripts/build-desktop.ps1

      - name: Verify desktop SQLite/auth tests
        shell: pwsh
        run: |
          & "./backend/.venv/Scripts/python.exe" -m pytest `
            backend/tests/test_desktop_sqlite.py `
            backend/tests/test_desktop_migrations.py `
            backend/tests/test_desktop_auth.py -q

      - name: Smoke test packaged backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "./frontend/desktop-backend/juba-lisan-backend.exe").Path
          $dataDir = Join-Path $env:RUNNER_TEMP "juba-lisan-smoke-data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.Arguments = "--host 127.0.0.1 --port 18080"
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.Environment["DESKTOP_MODE"] = "true"
          $psi.Environment["DATA_DIR"] = $dataDir
          $sqlitePath = (Join-Path $dataDir "database/juba_lisan.db") -replace "\\", "/"
          $psi.Environment["DATABASE_URL"] = "sqlite+aiosqlite:///" + $sqlitePath
          $psi.Environment["REDIS_ENABLED"] = "false"
          $psi.Environment["REDIS_URL"] = ""
          $psi.Environment["SECRET_KEY"] = "github-actions-desktop-smoke-secret-32chars-minimum"
          $psi.Environment["AUDIO_STORAGE_PATH"] = Join-Path $dataDir "audio"
          $psi.Environment["CORS_ORIGINS"] = '["http://127.0.0.1","http://localhost","null"]'

          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $psi
          [void]$process.Start()

          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18080/health" -TimeoutSec 2
                if ($response.status -eq "ok") { $ready = $true; break }
              } catch {
                if ($process.HasExited) {
                  $stderr = $process.StandardError.ReadToEnd()
                  throw "Packaged backend exited before /health became ready. $stderr"
                }
              }
            }
            if (-not $ready) {
              $stderr = $process.StandardError.ReadToEnd()
              throw "Packaged backend did not become healthy within 60 seconds. $stderr"
            }
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $registerBody = @{
              username = "smokeuser"
              email = "smoke@example.com"
              password = "StrongPass1!"
              display_name = "Smoke User"
              native_language = "fr"
              target_language = "en-GB"
            } | ConvertTo-Json

            $register = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18080/api/auth/register" `
              -Method Post `
              -ContentType "application/json" `
              -WebSession $session `
              -Body $registerBody
            if (-not $register.access_token) {
              throw "Packaged backend registration did not return an access token."
            }

            $logout = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18080/api/auth/logout" `
              -Method Post `
              -WebSession $session
            if ($logout.detail -ne "Logged out") {
              throw "Packaged backend registration logout failed."
            }

            $loginBody = @{
              email = "smoke@example.com"
              password = "StrongPass1!"
            } | ConvertTo-Json
            $login = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18080/api/auth/login" `
              -Method Post `
              -ContentType "application/json" `
              -WebSession $session `
              -Body $loginBody
            if (-not $login.access_token) {
              throw "Packaged backend login did not return an access token."
            }

            $refresh = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18080/api/auth/refresh" `
              -Method Post `
              -WebSession $session
            if (-not $refresh.access_token) {
              throw "Packaged backend refresh did not return an access token."
            }

            $me = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18080/api/auth/me" `
              -Method Get `
              -Headers @{ Authorization = "Bearer $($refresh.access_token)" } `
              -WebSession $session
            if ($me.email -ne "smoke@example.com") {
              throw "Packaged backend /me returned an unexpected user."
            }

            # Restart the packaged backend against the same SQLite data directory.
            # The WebRequestSession retains the HttpOnly refresh cookie, proving
            # refresh-token persistence across an application/backend restart.
            $process.Kill()
            $process.WaitForExit()

            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi
            [void]$process.Start()

            $readyAfterRestart = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18080/health" -TimeoutSec 2
                if ($response.status -eq "ok") { $readyAfterRestart = $true; break }
              } catch {
                if ($process.HasExited) {
                  $stderr = $process.StandardError.ReadToEnd()
                  throw "Packaged backend exited after restart. $stderr"
                }
              }
            }
            if (-not $readyAfterRestart) {
              $stderr = $process.StandardError.ReadToEnd()
              throw "Packaged backend did not recover after restart within 60 seconds. $stderr"
            }

            $refreshAfterRestart = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18080/api/auth/refresh" `
              -Method Post `
              -WebSession $session
            if (-not $refreshAfterRestart.access_token) {
              throw "Packaged backend refresh failed after restart; persisted session is not working."
            }

            $meAfterRestart = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18080/api/auth/me" `
              -Method Get `
              -Headers @{ Authorization = "Bearer $($refreshAfterRestart.access_token)" } `
              -WebSession $session
            if ($meAfterRestart.email -ne "smoke@example.com") {
              throw "Packaged backend /me failed after restart."
            }

            $finalLogout = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18080/api/auth/logout" `
              -Method Post `
              -WebSession $session
            if ($finalLogout.detail -ne "Logged out") {
              throw "Packaged backend final logout failed."
            }

          } finally {
            if (-not $process.HasExited) { $process.Kill(); $process.WaitForExit() }
          }

      - name: Smoke test packaged Next.js renderer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $backendExe = (Resolve-Path "./frontend/desktop-backend/juba-lisan-backend.exe").Path
          $rendererServer = (Resolve-Path "./frontend/next-standalone/server.js").Path
          $dataDir = Join-Path $env:RUNNER_TEMP "juba-lisan-renderer-data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          $backendPsi = New-Object System.Diagnostics.ProcessStartInfo
          $backendPsi.FileName = $backendExe
          $backendPsi.Arguments = "--host 127.0.0.1 --port 18081"
          $backendPsi.UseShellExecute = $false
          $backendPsi.CreateNoWindow = $true
          $backendPsi.RedirectStandardOutput = $true
          $backendPsi.RedirectStandardError = $true
          $backendPsi.Environment["DESKTOP_MODE"] = "true"
          $backendPsi.Environment["DATA_DIR"] = $dataDir
          $sqlitePath = (Join-Path $dataDir "database/juba_lisan.db") -replace "\\", "/"
          $backendPsi.Environment["DATABASE_URL"] = "sqlite+aiosqlite:///" + $sqlitePath
          $backendPsi.Environment["REDIS_ENABLED"] = "false"
          $backendPsi.Environment["REDIS_URL"] = ""
          $backendPsi.Environment["SECRET_KEY"] = "github-actions-renderer-smoke-secret-32chars-minimum"
          $backendPsi.Environment["AUDIO_STORAGE_PATH"] = Join-Path $dataDir "audio"
          $backendPsi.Environment["CORS_ORIGINS"] = '["http://127.0.0.1","http://localhost"]'

          $backend = New-Object System.Diagnostics.Process
          $backend.StartInfo = $backendPsi

          $rendererPsi = New-Object System.Diagnostics.ProcessStartInfo
          $rendererPsi.FileName = (Get-Command node).Source
          [void]$rendererPsi.ArgumentList.Add($rendererServer)
          $rendererPsi.UseShellExecute = $false
          $rendererPsi.CreateNoWindow = $true
          $rendererPsi.RedirectStandardOutput = $true
          $rendererPsi.RedirectStandardError = $true
          $rendererPsi.WorkingDirectory = (Split-Path $rendererServer)
          $rendererPsi.Environment["NODE_ENV"] = "production"
          $rendererPsi.Environment["HOSTNAME"] = "127.0.0.1"
          $rendererPsi.Environment["PORT"] = "18082"
          $rendererPsi.Environment["NEXT_TELEMETRY_DISABLED"] = "1"
          $rendererPsi.Environment["BACKEND_URL"] = "http://127.0.0.1:18081"

          $renderer = New-Object System.Diagnostics.Process
          $renderer.StartInfo = $rendererPsi

          try {
            # Start the backend first. The packaged Next.js landing page performs
            # request-time calls to /api/config and /api/reviews/public, so the
            # renderer must never race the backend during its first request.
            [void]$backend.Start()
            $backendReady = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18081/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $backendReady = $true; break }
              } catch {}

              if ($backend.HasExited) {
                $stderr = $backend.StandardError.ReadToEnd()
                throw "Renderer smoke backend exited unexpectedly. $stderr"
              }
            }

            if (-not $backendReady) {
              $stderr = $backend.StandardError.ReadToEnd()
              throw "Renderer smoke backend did not become healthy within 60 seconds. $stderr"
            }

            [void]$renderer.Start()
            $rendererReady = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $page = Invoke-WebRequest -Uri "http://127.0.0.1:18082/" -TimeoutSec 3
                if ($page.StatusCode -eq 200) { $rendererReady = $true; break }
              } catch {}

              if ($renderer.HasExited) {
                $stderr = $renderer.StandardError.ReadToEnd()
                throw "Packaged Next.js renderer exited unexpectedly. $stderr"
              }
            }

            if (-not $rendererReady) {
              $stderr = $renderer.StandardError.ReadToEnd()
              throw "Packaged Next.js renderer did not serve / within 60 seconds. $stderr"
            }
          } finally {
            if (-not $renderer.HasExited) { $renderer.Kill(); $renderer.WaitForExit() }
            if (-not $backend.HasExited) { $backend.Kill(); $backend.WaitForExit() }
          }

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: juba-lisan-windows
          path: |
            frontend/dist/*.exe
            frontend/dist/*.blockmap
            frontend/dist/latest.yml
          if-no-files-found: error
          retention-days: 14
