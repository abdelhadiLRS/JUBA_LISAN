name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/build-desktop*.ps1'
      - '.github/workflows/windows-desktop.yml'
      - 'alembic.ini'

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build Windows desktop artifacts
        shell: pwsh
        run: ./scripts/build-desktop.ps1

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: juba-lisan-windows
          path: |
            frontend/dist/*.exe
            frontend/dist/*.blockmap
            frontend/dist/latest.yml
          if-no-files-found: error
          retention-days: 14
