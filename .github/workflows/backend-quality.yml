name: Backend Quality

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install backend quality tools
        run: pip install pytest-cov ruff

      - name: Run backend lint
        run: ruff check app alembic --select E9,F821,F841,F541,B007,B905

      - name: Validate Alembic migrations
        env:
          DATABASE_URL: sqlite+aiosqlite:///ci-migrations.db
          SECRET_KEY: ci-secret-key
        run: |
          alembic upgrade head
          alembic check

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: ci-secret-key
        run: pytest -v
