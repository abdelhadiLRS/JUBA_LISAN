<svg width="760" height="560" viewBox="0 0 760 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B2A1E" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="tutorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>

  <!-- Outer Glass Frame -->
  <rect x="20" y="20" width="720" height="520" rx="36" fill="#F4FBF7" stroke="#1B2A1E" stroke-width="4" filter="url(#cardShadow)"/>

  <!-- Left Side: Interactive AI Character Avatar & Voice Hub -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="280" height="440" rx="28" fill="url(#tutorBg)" stroke="#1B2A1E" stroke-width="3"/>

    <!-- AI Mascot Head -->
    <circle cx="140" cy="140" r="70" fill="#E8F5E9" stroke="#1B2A1E" stroke-width="4"/>
    <circle cx="115" cy="130" r="10" fill="#1B2A1E"/>
    <circle cx="165" cy="130" r="10" fill="#1B2A1E"/>
    <circle cx="118" cy="126" r="4" fill="#FFF"/>
    <circle cx="168" cy="126" r="4" fill="#FFF"/>
    <path d="M125 155 Q140 170 155 155" stroke="#1B2A1E" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Antenna Spark -->
    <line x1="140" y1="70" x2="140" y2="45" stroke="#FFD54F" stroke-width="5" stroke-linecap="round"/>
    <circle cx="140" cy="38" r="10" fill="#FFC107" stroke="#1B2A1E" stroke-width="3"/>

    <text x="140" y="240" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle">JUBA AI Tutor</text>
    <text x="140" y="268" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#A5D6A7" text-anchor="middle">Voice & Grammar Coach</text>

    <!-- Animated Waveform Visualizer -->
    <g transform="translate(40, 310)">
      <rect x="0" y="0" width="200" height="60" rx="20" fill="#1B2A1E" opacity="0.6"/>
      <!-- Wave bars -->
      <line x1="30" y1="30" x2="30" y2="30" stroke="#FFCA28" stroke-width="5" stroke-linecap="round"/>
      <line x1="45" y1="18" x2="45" y2="42" stroke="#66BB6A" stroke-width="5" stroke-linecap="round"/>
      <line x1="60" y1="10" x2="60" y2="50" stroke="#66BB6A" stroke-width="5" stroke-linecap="round"/>
      <line x1="75" y1="22" x2="75" y2="38" stroke="#FFCA28" stroke-width="5" stroke-linecap="round"/>
      <line x1="90" y1="8"  x2="90" y2="52" stroke="#66BB6A" stroke-width="5" stroke-linecap="round"/>
      <line x1="105" y1="15" x2="105" y2="45" stroke="#66BB6A" stroke-width="5" stroke-linecap="round"/>
      <line x1="120" y1="25" x2="120" y2="35" stroke="#FFCA28" stroke-width="5" stroke-linecap="round"/>
      <line x1="135" y1="12" x2="135" y2="48" stroke="#66BB6A" stroke-width="5" stroke-linecap="round"/>
      <line x1="150" y1="20" x2="150" y2="40" stroke="#66BB6A" stroke-width="5" stroke-linecap="round"/>
      <line x1="165" y1="30" x2="165" y2="30" stroke="#FFCA28" stroke-width="5" stroke-linecap="round"/>
    </g>

    <text x="140" y="398" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFD54F" text-anchor="middle">🎙️ Listening to pronunciation...</text>
  </g>

  <!-- Right Side: Real Chat Bubble Conversation Mock -->
  <!-- Tutor Message 1 -->
  <g transform="translate(370, 70)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="310" height="95" rx="20" fill="#FFFFFF" stroke="#1B2A1E" stroke-width="3"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#2E7D32">JUBA AI Coach 🤖</text>
    <text x="20" y="58" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#1B2A1E">"كيف حالك اليوم؟ هل تتمرن على المحادثة؟"</text>
    <text x="20" y="80" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#757575">How are you today? Practicing speaking?</text>
  </g>

  <!-- User Message (Voice Input Response) -->
  <g transform="translate(390, 190)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="290" height="85" rx="20" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#1565C0">You (Learner) 🗣️</text>
    <text x="20" y="58" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#1B2A1E">"نعم، أريد تحسين مهاراتي!"</text>
  </g>

  <!-- Instant AI Grammar Feedback Chip -->
  <g transform="translate(370, 300)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="310" height="110" rx="20" fill="#FFF9C4" stroke="#1B2A1E" stroke-width="3"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#E65100">✨ Instant AI Feedback</text>
    <text x="20" y="58" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#2E7D32">Pronunciation Accuracy: 98%</text>
    <text x="20" y="82" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#424242">Fluency & Grammar score excellent!</text>
  </g>
</svg>
