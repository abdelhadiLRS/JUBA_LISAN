<svg width="760" height="520" viewBox="0 0 760 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gameShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2A1E" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="720" height="480" rx="32" fill="#FEFBF3" stroke="#1B2A1E" stroke-width="4" filter="url(#gameShadow)"/>

  <!-- Header Banner -->
  <rect x="60" y="50" width="640" height="60" rx="20" fill="#FFF3E0" stroke="#FF9800" stroke-width="3"/>
  <text x="90" y="86" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#E65100">🎮 Interactive Learning Arcade</text>
  <text x="500" y="86" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#2E7D32">4 Game Modes Active</text>

  <!-- Game 1: Matching Game Card -->
  <g transform="translate(60, 130)" filter="url(#gameShadow)">
    <rect x="0" y="0" width="300" height="150" rx="20" fill="#FFFFFF" stroke="#1B2A1E" stroke-width="3"/>
    <rect x="15" y="15" width="125" height="50" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="77" y="46" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#1B2A1E" text-anchor="middle">شجرة 🌳</text>

    <rect x="160" y="15" width="125" height="50" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="222" y="46" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#1B2A1E" text-anchor="middle">Tree 🌳</text>

    <!-- Match Connection Line -->
    <path d="M140 40 L160 40" stroke="#4CAF50" stroke-width="4" stroke-dasharray="4 4"/>
    <circle cx="150" cy="40" r="10" fill="#4CAF50"/>
    <text x="150" y="44" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#FFF" text-anchor="middle">✓</text>

    <text x="15" y="100" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#2E7D32">Word Match Challenge</text>
    <text x="15" y="125" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#757575">Connect words with their translations</text>
  </g>

  <!-- Game 2: Sentence Builder Card -->
  <g transform="translate(400, 130)" filter="url(#gameShadow)">
    <rect x="0" y="0" width="300" height="150" rx="20" fill="#FFFFFF" stroke="#1B2A1E" stroke-width="3"/>

    <!-- Word Blocks -->
    <rect x="15" y="20" width="80" height="40" rx="10" fill="#E1F5FE" stroke="#0288D1" stroke-width="2"/>
    <text x="55" y="45" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#01579B" text-anchor="middle">أنا</text>

    <rect x="105" y="20" width="80" height="40" rx="10" fill="#E1F5FE" stroke="#0288D1" stroke-width="2"/>
    <text x="145" y="45" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#01579B" text-anchor="middle">أتعلم</text>

    <rect x="195" y="20" width="90" height="40" rx="10" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2"/>
    <text x="240" y="45" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#F57F17" text-anchor="middle">اللغة ✦</text>

    <text x="15" y="100" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#0288D1">Sentence Builder</text>
    <text x="15" y="125" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#757575">Assemble natural phrases step by step</text>
  </g>

  <!-- Game 3: Memory Cards -->
  <g transform="translate(60, 310)" filter="url(#gameShadow)">
    <rect x="0" y="0" width="300" height="150" rx="20" fill="#FFFFFF" stroke="#1B2A1E" stroke-width="3"/>

    <!-- Memory Cards grid preview -->
    <rect x="15" y="15" width="55" height="55" rx="10" fill="#FFEBEE" stroke="#E53935" stroke-width="2"/>
    <text x="42" y="50" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#E53935" text-anchor="middle">🍎</text>

    <rect x="80" y="15" width="55" height="55" rx="10" fill="#3E2723" stroke="#1B2A1E" stroke-width="2"/>
    <text x="107" y="50" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#FFF" text-anchor="middle">?</text>

    <rect x="145" y="15" width="55" height="55" rx="10" fill="#FFEBEE" stroke="#E53935" stroke-width="2"/>
    <text x="172" y="50" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#E53935" text-anchor="middle">🍎</text>

    <text x="15" y="100" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#C62828">Memory Flip</text>
    <text x="15" y="125" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#757575">Train recall and visual memory</text>
  </g>

  <!-- Game 4: Sentence Ordering -->
  <g transform="translate(400, 310)" filter="url(#gameShadow)">
    <rect x="0" y="0" width="300" height="150" rx="20" fill="#FFFFFF" stroke="#1B2A1E" stroke-width="3"/>

    <rect x="15" y="20" width="270" height="45" rx="12" fill="#F3E5F5" stroke="#AB47BC" stroke-width="2"/>
    <text x="35" y="48" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#7B1FA2">1 ➔ 2 ➔ 3 Sequence Quest</text>

    <text x="15" y="100" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#7B1FA2">Grammar Ordering</text>
    <text x="15" y="125" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#757575">Order words to master grammar structures</text>
  </g>
</svg>
